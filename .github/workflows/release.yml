name: Release
run-name: Release ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify tag
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and check out tag
        id: release
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF_TYPE" != "tag" || "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Select an existing Git tag in 'Use workflow from'." >&2
            exit 1
          fi

          git check-ref-format "$RELEASE_REF"

          if ! git show-ref --verify --quiet "$RELEASE_REF"; then
            echo "The pushed tag does not exist: $RELEASE_TAG" >&2
            exit 1
          fi

          release_commit="$(git rev-parse "$RELEASE_REF^{commit}")"
          dispatch_commit="$(git rev-parse "$DISPATCH_SHA^{commit}")"
          if [[ "$release_commit" != "$dispatch_commit" ]]; then
            echo "The tag changed after the workflow was dispatched: $RELEASE_TAG" >&2
            exit 1
          fi

          git checkout --detach "$release_commit"

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Swift
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.7.7"
          install_args: swift
          cache: true

      - name: Verify Swift toolchain
        run: |
          set -euo pipefail
          swift --version
          swift --version | grep -F "Swift version 6.3.3"
          grep -Fqx 'swift.toolchain = "Swift 6.3.3"' Upstream.lock
          grep -Fqx 'swift = "6.3.3"' mise.toml

      - name: Run tests
        run: swift test

      - name: Build release configuration
        run: swift build --configuration release

  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reverify tag
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "The pushed tag disappeared before publication: $RELEASE_TAG" >&2
            exit 1
          fi

          release_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$release_commit" != "$VERIFIED_COMMIT" ]]; then
            echo "The tag changed after verification: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for tag: $RELEASE_TAG" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
